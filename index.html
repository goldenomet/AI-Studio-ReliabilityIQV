<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preload" href="https://www.chatbase.co/embed.min.js" as="script" />
    <title>ReliabilityIQ Ventures | Enterprise IT Solutions Nigeria & Global</title>
    <meta name="description" content="ReliabilityIQ Ventures delivers comprehensive Enterprise IT Solutions in Nigeria and globally, specializing in Web Operations, AI Automations, GIS Mapping, and Technical Reports." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ReliabilityIQ Ventures | Enterprise IT Solutions Nigeria & Global" />
    <meta property="og:description" content="ReliabilityIQ Ventures delivers comprehensive Enterprise IT Solutions in Nigeria and globally, specializing in Web Operations, AI Automations, GIS Mapping, and Technical Reports." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReliabilityIQ Ventures | Enterprise IT Solutions Nigeria & Global" />
    <meta name="twitter:description" content="ReliabilityIQ Ventures delivers comprehensive Enterprise IT Solutions in Nigeria and globally, specializing in Web Operations, AI Automations, GIS Mapping, and Technical Reports." />
    <meta name="twitter:image" content="/logo.png" />
  </head>
  <body>
    <!-- Chatbase Embed -->
    <script>
      window.chatbaseConfig = {
        chatbotId: "mvZXnexLD-jXGJa0ZUPgT",
      };
      
      // Initialize chatbase queue
      if(!window.chatbase||window.chatbase("getState")!=="initialized"){
        window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};
        window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}});
      }
      
      // Register the client-side action for the custom form
      window.addEventListener('load', () => {
        if (window.chatbase) {
          window.chatbase('on', 'functionCall', async (functionCall) => {
            if (functionCall.functionName === 'submitContact') {
              console.log('Chatbase Contact Form Submitted:', functionCall.args);
              
              // Here you would typically send the data to your backend API
              // e.g., await fetch('/api/contact', { method: 'POST', body: JSON.stringify(functionCall.args) })
              
              // Simulate network request
              await new Promise(resolve => setTimeout(resolve, 1000));
              
              // Return response back to the chat widget to show success state
              return { 
                success: true, 
                message: "Thanks! We've received your message and will get back to you soon." 
              };
            }
          });
        }
      });
    </script>
    <script src="https://www.chatbase.co/embed.min.js" id="mvZXnexLD-jXGJa0ZUPgT" domain="www.chatbase.co" async></script>
    <script>
      async function initChatbaseIdentity() {
        try {
          const res = await fetch('/api/chatbase-token');
          if (res.ok) {
            const { token } = await res.json();
            if (token && window.chatbase) {
              window.chatbase('identify', { token });
            }
          }
        } catch (e) {
          console.error('Chatbase identity error:', e);
        }
      }
      initChatbaseIdentity();
    </script>
    
    <div id="root"></div>
    
    <!-- Hidden static form for Netlify Crawler -->
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <select name="service">
        <option>Web Operations</option>
        <option>AI Automations</option>
        <option>GIS Mapping</option>
        <option>Technical Reports</option>
        <option>Content & Design</option>
      </select>
      <textarea name="details"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
