<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>ReliabilityIQ Ventures | Enterprise IT Solutions Nigeria & Global</title>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Hidden static form for Netlify Crawler -->
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <select name="service">
        <option>Web Operations</option>
        <option>AI Automations</option>
        <option>GIS Mapping</option>
        <option>Technical Reports</option>
        <option>Content & Design</option>
      </select>
      <textarea name="details"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
